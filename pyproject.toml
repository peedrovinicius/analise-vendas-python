[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-gestao-analise-vendas"
version = "0.1.0"
description = "Projeto de dados e aplicação baseado no Brazilian E-Commerce Public Dataset by Olist."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "matplotlib>=3.8,<4.0",
    "jupyter>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]
